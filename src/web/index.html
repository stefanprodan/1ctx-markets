<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#131314" />
    <!-- installed on iOS: "default" paints the status bar in the
         theme-color, which app/theme.ts keeps in the page colour, with
         text to match; "black-translucent" keeps white text over the
         light theme -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Markets" />
    <script>
      // the theme before the first paint; app/theme.ts takes over
      (() => {
        var kept = null;
        try {
          kept = localStorage.getItem("theme");
        } catch {}
        var theme =
          kept === "light" || kept === "dark"
            ? kept
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
        if (theme === "light")
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#f4f2ec");
      })();
    </script>
    <title>1ctx Markets</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- its icons are named by fixed paths that main.ts serves, since
         the bundler hashes this file without rewriting what it names -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link
      rel="preload"
      href="./fonts/IBMPlexSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/JetBrainsMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* tokens.css's colours, copied as it lands later; the lowest layer */
      @layer boot {
        html {
          background: #131314;
        }
        .boot {
          display: none;
          color: #e7e7e9;
          --sparkle: #f2c14e;
        }
        /* Preact appends to #app, so the frame hides once it has content */
        #app:empty + .boot {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          /* a fast load replaces it before it shows */
          animation: boot-in 0.3s 0.5s both;
        }
        /* base.css's placeholder pulse, so a slow load reads as working */
        #app:empty + .boot svg {
          animation: boot-pulse 1.6s ease-in-out 0.8s infinite;
        }
        :root[data-theme="light"] {
          background: #f4f2ec;
        }
        :root[data-theme="light"] .boot {
          color: #1a1a1c;
          --sparkle: #d9a53a;
        }
        @keyframes boot-in {
          from {
            opacity: 0;
          }
        }
        @keyframes boot-pulse {
          50% {
            opacity: 0.45;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #app:empty + .boot {
            animation-duration: 0s;
          }
          #app:empty + .boot svg {
            animation: none;
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="boot">
      <svg
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-label="Markets"
        role="img"
      >
        <path
          d="M13.5 4H11C6.757 4 4.636 4 3.318 5.318S2 8.758 2 13s0 6.364 1.318 7.682S6.758 22 11 22s6.364 0 7.682-1.318S20 17.242 20 13v-2.5"
        />
        <path d="M5.5 17 9.25 12.75 12.25 14.75 16.5 9" />
        <path
          fill="var(--sparkle)"
          stroke="none"
          d="M19.5 1.0C19.5 2.925 21.075 4.5 23.0 4.5C21.075 4.5 19.5 6.075 19.5 8.0C19.5 6.075 17.925 4.5 16.0 4.5C17.925 4.5 19.5 2.925 19.5 1.0Z"
        />
      </svg>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
